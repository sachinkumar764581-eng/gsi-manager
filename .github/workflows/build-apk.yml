name: Build Fee Manager Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Project
        run: |
          cordova create gsi_app com.gsi.manager "Fee Manager Pro"
          cd gsi_app
          rm -rf www/*
          cp ../index.html www/index.html
          cp ../icon.png www/icon.png
          cp ../config.xml config.xml
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fee-Manager-Pro-APK
          path: gsi_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
