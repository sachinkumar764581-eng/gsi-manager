name: Build Fee Manager Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install -g cordova

      - name: Build Project & Inject WebView Permissions
        run: |
          cordova create gsi_app com.gsi.manager "Fee Manager Pro"
          cd gsi_app
          rm -rf www/*
          cp ../index.html www/index.html
          cp ../icon.png www/icon.png
          cp ../config.xml config.xml
          
          cordova platform add android
          
          # एंड्रॉइड WebView में फाइल डाउनलोड और स्टोरेज परमिशन को कोड स्तर पर इनेबल करना
          ANDROID_JAVA_FILE="platforms/android/app/src/main/java/com/gsi/manager/MainActivity.java"
          if [ -f "$ANDROID_JAVA_FILE" ]; then
            echo "Injecting DownloadListener into MainActivity.java..."
            sed -i '/public void onCreate(Bundle savedInstanceState) {/a \        super.init();\n        appView.getEngine().getView().setDownloadListener(new android.webkit.DownloadListener() {\n            @Override\n            public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {\n                android.content.Intent i = new android.content.Intent(android.content.Intent.ACTION_VIEW);\n                i.setData(android.net.Uri.parse(url));\n                startActivity(i);\n            }\n        });' "$ANDROID_JAVA_FILE"
          fi

          cordova build android --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fee-Manager-Pro-Master-APK
          path: gsi_app/platforms/android/app/build/outputs/apk/release/app-release.apk
